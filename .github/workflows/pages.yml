# פרסום האפליקציה ל-GitHub Pages בכל דחיפה ל-main.
#
# האפליקציה כולה רצה בדפדפן — אין שרת, אין בסיס נתונים מרוחק, והכול
# נשמר ב-IndexedDB במכשיר של המשתמש. לכן אתר סטטי הוא כל מה שצריך.
#
# הפעלה חד-פעמית, ביד: Settings ← Pages ← Source: GitHub Actions.
#
# אי אפשר להפעיל את זה מכאן. actions/configure-pages עם enablement
# נכשל ב-"Resource not accessible by integration": יצירת אתר Pages
# דורשת הרשאת administration, ו-token של workflow לעולם אינו מקבל
# אותה. גם קריאת ההגדרות נכשלת כשהאתר לא קיים, ולכן אין כאן שלב
# configure-pages בכלל — נתיב הבסיס נקבע ב-BASE_PATH שלמטה.
name: פרסום ל-GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע; דחיפה חדשה אינה מבטלת פרסום שכבר רץ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # חבילות החוזה, בדפדפן אמיתי, לפני שמשהו עולה לאוויר.
  #
  # `npm run build` מריץ טיפוסים ובנייה, וזה כל מה שנבדק כאן עד
  # היום: גרסה שבה שמירה דורסת ארגז, או שאיור מוחק מגירות, עברה
  # אותו בירוק ופורסמה. הבדיקות רצות מול האפליקציה עצמה, ולכן
  # הן צריכות שרת פיתוח ודפדפן — ולכן זו משרה נפרדת.
  contract:
    runs-on: ubuntu-latest
    # שער שנתקע גרוע משער שנופל: הוא חוסם פרסום בשקט, לשעות
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # בלי `--with-deps`: הוא מריץ apt, ובמכונה של GitHub הספריות
      # כבר שם — בריצה הראשונה הוא נתקע שם עשרים וחמש דקות
      - run: npx playwright install chromium
      # שרת הפיתוח והבדיקות באותו שלב: תהליך רקע אינו שורד מעבר שלב.
      #
      # והפלט שלו מנותב לקובץ ונסגר. תהליך רקע שיורש את ה-stdout של
      # השלב מחזיק את צינור הלוג פתוח, והמריץ ממתין לסגירתו — הבדיקות
      # עברו, והשלב נשאר "רץ" עד לתקרת הזמן. זו לא הייתה תקיעה
      # בבדיקות אלא בשורה הזאת.
      - name: בדיקות חוזה מול שרת פיתוח
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          vite=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && break
            sleep 2
          done
          # `bash -e` מפיל את השלב על הכישלון עצמו, ואז הלוג של
          # השרת לא נקרא. התנאי שומר את הקוד כדי שיהיה מה לקרוא.
          code=0
          npm run test:contract || code=$?
          kill "$vite" 2>/dev/null || true
          [ "$code" -eq 0 ] || tail -40 /tmp/vite.log
          exit "$code"

  build:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # הדפדפנים של Playwright אינם נחוצים לבנייה
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # האתר יושב תחת /EasyCraft/ ולא בשורש הדומיין
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
